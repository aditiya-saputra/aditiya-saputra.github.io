<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <title>404 — Halaman Tidak Ditemukan</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --muted: #888888;
      --border: #2a2a2a;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      line-height: 1.7;
    }
    .wrap { max-width: 620px; }
    .badge {
      display: inline-block;
      margin-bottom: 1.25rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(1.8rem, 6vw, 2.6rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    p { margin: 0 0 2rem; color: var(--muted); max-width: 52ch; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    a {
      display: inline-block;
      padding: 0.7rem 1.1rem;
      font-size: 0.85rem;
      text-decoration: none;
      border: 1px solid var(--text);
      transition: background 0.15s ease, color 0.15s ease;
    }
    a.primary { background: var(--text); color: var(--bg); }
    a.primary:hover { background: transparent; color: var(--text); }
    a.secondary { color: var(--text); border-color: var(--border); }
    a.secondary:hover { border-color: var(--text); }
    a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="badge">ERROR // 404</div>
    <h1>Halaman tidak ada</h1>
    <p>Alamat yang kamu buka tidak ditemukan. Mungkin tautannya salah ketik atau sudah dipindahkan.</p>
    <div class="actions">
      <a href="https://aditiya-saputra.github.io/website-aditiya/" class="primary">Kembali ke Beranda</a>
      <a href="https://github.com/aditiya-saputra" class="secondary" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
    </div>
  </div>
</body>
</html>
